<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="qoomia-maskable-title">
  <title id="qoomia-maskable-title">Qoomia — icona maskable</title>
  <defs>
    <linearGradient id="qoomia-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <mask id="cutout-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <polyline points="172,235 218,342 252,292 276,320 422,174"
                fill="none" stroke="black" stroke-width="54"
                stroke-linecap="square" stroke-linejoin="miter"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#qoomia-bg)"/>

  <!-- L'artwork originale è ridotto all'80% e centrato nella safe area maskable. -->
  <g transform="translate(51.2 51.2) scale(0.8)">
    <g mask="url(#cutout-mask)" fill="none" stroke="#FFFFFF" stroke-width="28">
      <circle cx="176" cy="232" r="112"/>
      <circle cx="322" cy="256" r="92"/>
    </g>
    <polyline points="172,235 218,342 252,292 276,320 422,174"
              fill="none" stroke="#FFFFFF" stroke-width="28"
              stroke-linecap="butt" stroke-linejoin="miter"/>
    <polygon points="392,140 456,140 456,204" fill="#FFFFFF"/>
  </g>
</svg>
